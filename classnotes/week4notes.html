<!DOCTYPE html>

<html lang="en"> 

<head> 
    <meta charset="utf-8">
    <title> title goes here </title>
</head>

<body>
    <h1> Tables </h1>
    <table> 
        <caption> First Table </caption>
        <tr>
            <th>Column One</th>
            <th> Column Two</th> 
            <th> Column Three</th>
        </tr>
        <tr> 
            <td> Cell 1 </td>
            <td> Cell 2 </td>
            <td> Cell 3 </td>
        </tr>
    </table>

        <h1> Forms </h1>
        <form action="" method=""> 
            <label for ="fname"> Enter First Name: </label>
            <!--fname is first name, id of fname-->
            <input type="text" id="fname" name="fname">
            <!-- attach label to this particular label, id= ... -->
             <br>
             <label for ="lname"> Enter Last Name: </label>
             <input type="text" id="lname" name="lname">
            <br>
            <br>
             <label for="comments"> Comments:</label>
             <br>
             <textarea id="comments" name="comments">
             </textarea>
            
            <p> Pick a Number </p>

            <input type="radio" id="number 1" name="numbers" value="1">
            <label for ="number 1"> 1 </label>
             <input type="radio" id="number 2" name="numbers" value="2">
            <label for ="number 1"> 2 </label>
             <input type="submit" value="Submit This Form">

             <h1> Input</h1>
             <input type="checkbox" id="veh1" name="veh1" value="Bike">
            <label for="veh1"> I have a Bik </label>
             <input type="checkbox" id="veh2" name="veh2" value="Car">
              <label for ="veh2"> I have a Car,  </label>

              <label for="cars"> Select a Car</label>
              <select id="Cars" name="cars">
                <option value="BMW"> BMW </option>
                 <option value="Ford"> Ford </option>
              </select>
        </form>

    
  
</body>

</html>
